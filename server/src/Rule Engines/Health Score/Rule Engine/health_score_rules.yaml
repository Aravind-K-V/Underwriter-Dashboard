# Blood Test Scoring System Rules
# This YAML file defines the rules and scoring system for evaluating blood test results

scoring_framework:
  normal: 0      # -0 points (no deduction)
  borderline: -1 # -1 point deduction
  abnormal: -3   # -3 points deduction
  severe: -5     # -5 points deduction
  base_score: 160 # Starting score for all proposers

# Red Flag Rules - Override scoring if any severe condition is met
red_flag_rules:
  - parameter: "hemoglobin"
    condition: "< 7"
    action: "severe"
    message: "Critical hemoglobin level requires immediate medical attention"
  
  - parameter: "creatinine"
    condition: "> 2.5"
    action: "severe"
    message: "Critical creatinine level requires immediate medical attention"
  
  - parameter: "troponin"
    condition: "positive_high"
    action: "severe"
    message: "Positive troponin indicates cardiac emergency"
  
  - parameter: "nt_probnp"
    condition: "> 1000"
    action: "severe"
    message: "Very high NT-proBNP requires urgent cardiac evaluation"

# Complete Blood Count (CBC) Rules
cbc_rules:
  hemoglobin:
    male:
      normal: "13-17"
      borderline: "11-12.9"
      abnormal: "<10 OR >18"
      severe: "<7"
    female:
      normal: "12-15"
      borderline: "10-11.9"
      abnormal: "<9 OR >17"
      severe: "<7"
    unit: "g/dL"
  
  wbc_count:
    normal: "4000-11000"
    borderline: "3000-3900 OR 11001-15000"
    abnormal: "<3000 OR >15000"
    severe: "<2000 OR >20000"
    unit: "/µL"
  
  platelets:
    normal: "150000-450000"
    borderline: "100000-149000 OR 451000-600000"
    abnormal: "<100000 OR >600000"
    severe: "<50000 OR >1000000"
    unit: "/µL"
  
  neutrophils:
    normal: "40-70"
    borderline: "35-39 OR 71-75"
    abnormal: "<35 OR >75"
    severe: "<20 OR >90"
    unit: "%"
  
  lymphocytes:
    normal: "20-40"
    borderline: "15-19 OR 41-45"
    abnormal: "<15 OR >45"
    severe: "<10 OR >60"
    unit: "%"
  
  monocytes:
    normal: "2-10"
    borderline: "1-1.9 OR 11-12"
    abnormal: "<1 OR >12"
    severe: ">15"
    unit: "%"
  
  eosinophils:
    normal: "1-6"
    borderline: "0.5-0.9 OR 7-8"
    abnormal: "<0.5 OR >8"
    severe: ">10"
    unit: "%"
  
  basophils:
    normal: "<1"
    borderline: "1-2"
    abnormal: ">2"
    severe: ">5"
    unit: "%"
  
  esr:
    male:
      normal: "<15"
      borderline: "16-30"
      abnormal: "31-60"
      severe: ">60"
    female:
      normal: "<20"
      borderline: "21-30"
      abnormal: "31-60"
      severe: ">60"
    unit: "mm/hr"
  
  crp:
    normal: "<5"
    borderline: "5-10"
    abnormal: "11-30"
    severe: ">30"
    unit: "mg/L"

# Kidney/Renal Function Tests
renal_function_rules:
  creatinine:
    male:
      normal: "0.7-1.2"
      borderline: "1.3-1.5"
      abnormal: ">1.5"
      severe: ">2.5"
    female:
      normal: "0.6-1.1"
      borderline: "1.2-1.4"
      abnormal: ">1.4"
      severe: ">2.5"
    unit: "mg/dL"
  
  blood_urea:
    normal: "7-20"
    borderline: "21-40"
    abnormal: "41-80"
    severe: ">80"
    unit: "mg/dL"
  
  uric_acid:
    male:
      normal: "3.5-7.2"
      borderline: "7.3-8.5"
      abnormal: ">8.5"
      severe: ">10"
    female:
      normal: "2.6-6.0"
      borderline: "6.1-7.0"
      abnormal: ">7.0"
      severe: ">10"
    unit: "mg/dL"
  
  urine_routine:
    normal: "no_sugar_protein"
    borderline: "trace_protein_sugar"
    abnormal: "proteinuria_glycosuria_hematuria"
    severe: "massive_protein_blood"

# Liver Function Tests
liver_function_rules:
  bilirubin:
    normal: "0.3-1.2"
    borderline: "1.3-2.0"
    abnormal: "2.1-3.0"
    severe: ">3.0"
    unit: "mg/dL"
  
  sgpt_alt:
    normal: "<40"
    borderline: "41-60"
    abnormal: "61-100"
    severe: ">100"
    unit: "U/L"
  
  sgot_ast:
    normal: "<40"
    borderline: "41-60"
    abnormal: "61-100"
    severe: ">100"
    unit: "U/L"
  
  alkaline_phosphatase:
    normal: "44-147"
    borderline: "148-200"
    abnormal: "201-300"
    severe: ">300"
    unit: "U/L"
  
  albumin:
    normal: "3.5-5.5"
    borderline: "3.0-3.4"
    abnormal: "2.5-2.9"
    severe: "<2.5"
    unit: "g/dL"

# Lipid Profile Rules
lipid_profile_rules:
  total_cholesterol:
    normal: "<200"
    borderline: "200-239"
    abnormal: "240-280"
    severe: ">280"
    unit: "mg/dL"
  
  ldl:
    normal: "<100"
    borderline: "100-129"
    abnormal: "130-160"
    severe: ">160"
    unit: "mg/dL"
  
  hdl:
    male:
      normal: ">40"
      borderline: "35-40"
      abnormal: "<35"
      severe: "<25"
    female:
      normal: ">50"
      borderline: "45-50"
      abnormal: "<45"
      severe: "<35"
    unit: "mg/dL"
  
  triglycerides:
    normal: "<150"
    borderline: "150-199"
    abnormal: "200-400"
    severe: ">400"
    unit: "mg/dL"

# Sugar Tests Rules
sugar_tests_rules:
  fasting_sugar:
    normal: "70-99"
    borderline: "100-125"
    abnormal: "126-150"
    severe: ">150"
    unit: "mg/dL"
  
  postprandial:
    normal: "<140"
    borderline: "141-199"
    abnormal: "200-250"
    severe: ">250"
    unit: "mg/dL"
  
  hba1c:
    normal: "<5.7"
    borderline: "5.7-6.4"
    abnormal: "6.5-7.5"
    severe: ">7.5"
    unit: "%"

# Thyroid Profile Rules
thyroid_rules:
  tsh:
    normal: "0.4-4.0"
    borderline: "0.2-0.39 OR 4.1-6.0"
    abnormal: "<0.2 OR >6.0"
    severe: "<0.1 OR >10"
    unit: "mIU/L"
  
  free_t4:
    normal: "0.8-1.8"
    borderline: "0.6-0.79 OR 1.81-2.0"
    abnormal: "0.4-0.59 OR >2.0"
    severe: "<0.4"
    unit: "ng/dL"

# Vitamin & Mineral Tests
vitamin_mineral_rules:
  vitamin_d:
    normal: "30-100"
    borderline: "20-29"
    abnormal: "10-19"
    severe: "<10"
    unit: "ng/mL"
  
  vitamin_b12:
    normal: "200-900"
    borderline: "150-199"
    abnormal: "100-149"
    severe: "<100"
    unit: "pg/mL"
  
  calcium:
    normal: "8.5-10.5"
    borderline: "8.0-8.4 OR 10.6-11.0"
    abnormal: "7.0-7.9 OR 11.1-12.0"
    severe: "<7.0 OR >12.0"
    unit: "mg/dL"

# Cardiac Tests Rules
cardiac_rules:
  nt_probnp:
    under_75:
      normal: "<125"
      borderline: "126-300"
      abnormal: "301-1000"
      severe: ">1000"
    over_75:
      normal: "<450"
      borderline: "451-600"
      abnormal: "601-1000"
      severe: ">1000"
    unit: "pg/mL"
  
  troponin:
    normal: "negative"
    borderline: "not_applicable"
    abnormal: "positive_low"
    severe: "positive_high"
  
  ecg:
    normal: "normal"
    borderline: "mild_changes"
    abnormal: "abnormal"
    severe: "severe_changes"
  
  chest_xray:
    normal: "normal"
    borderline: "mild_changes"
    abnormal: "abnormal"
    severe: "severe_changes"

# Vitals & BMI Rules
vitals_bmi_rules:
  blood_pressure:
    systolic:
      normal: "<120"
      borderline: "120-139"
      abnormal: "140-159"
      severe: "≥160"
    diastolic:
      normal: "<80"
      borderline: "80-89"
      abnormal: "90-99"
      severe: "≥100"
    unit: "mmHg"
  
  bmi:
    normal: "18.5-24.9"
    borderline: "17.0-18.4 OR 25.0-29.9"
    abnormal: "<17.0 OR 30.0-34.9"
    severe: "≥35.0"
    unit: "kg/m²"

# Additional Laboratory Parameters (Alternative Scoring System)
lab_parameters_alternative:
  rbc_count:
    normal: "4.7-6.1"
    borderline_1: "4.2-4.69 OR 6.11-6.5"
    severe: "<3.0 OR >7.5"
    unit: "mill/uL"
  
  hematocrit:
    normal: "40-52"
    borderline_2: "35-39 OR 53-55"
    severe: "<20 OR >70"
    unit: "%"
  
  mcv:
    normal: "80-100"
    borderline_1: "75-79 OR 101-110"
    abnormal_4: "<75 OR >110"
    unit: "fL"
  
  mch:
    normal: "26-34"
    borderline_2: "22-25 OR 35-40"
    abnormal_4: "<22 OR >40"
    unit: "pg"
  
  mchc:
    normal: "31-37"
    borderline_2: "30 OR 38"
    abnormal_4: "<30 OR >38"
    unit: "g/dL"
  
  ggtp:
    normal: "5-73"
    borderline_2: "74-99"
    abnormal_4: "100-149"
    severe: ">150"
    unit: "U/L"
  
  urinary_cotinine:
    normal: "<200"
    borderline_2: "200-500"
    severe: ">500"
    unit: "ng/mL"
  
  hbsag:
    normal: "non_reactive"
    severe: "reactive"
  
  hiv_antibody:
    normal: "non_reactive"
    severe: "reactive"

# Absolute Count Rules
absolute_count_rules:
  absolute_neutrophil_count:
    normal: "2.0-7.0"
    borderline_2: "1.0-1.9 OR 7.1-8.0"
    abnormal_4: ">8.0"
    unit: "x10³/µL"
  
  absolute_lymphocyte_count:
    normal: "1.0-3.0"
    borderline_2: "0.5-0.9 OR 3.1-5.0"
    abnormal_4: ">5.0"
    unit: "x10³/µL"
  
  absolute_eosinophil_count:
    normal: "0.02-0.50"
    borderline_2: "0.01-0.019 OR 0.51-1.0"
    abnormal_4: "<0.01 OR >1.0"
    unit: "x10³/µL"
  
  absolute_monocyte_count:
    normal: "0.20-1.00"
    borderline_2: "0.10-0.19 OR 1.01-1.5"
    abnormal_4: "<0.10 OR >1.5"
    unit: "x10³/µL"
  
  absolute_basophil_count:
    normal: "0.02-0.10"
    borderline_2: "0.01-0.019 OR 0.11-0.20"
    abnormal_4: "<0.01 OR >0.20"
    unit: "x10³/µL"

# Risk Assessment Rules
risk_assessment:
  total_score_ranges:
    safe: "> 80% of maximum possible score"
    low_risk: "60-80% of maximum possible score"
    medium_risk: "40-59% of maximum possible score"
    high_risk: "20-39% of maximum possible score"
    critical: "< 20% of maximum possible score"
  
  red_flag_override:
    condition: "any_severe_parameter"
    result: "critical_risk"
    message: "Immediate medical attention required regardless of total score"

# Special Conditions
special_conditions:
  pregnancy:
    modified_ranges:
      hemoglobin:
        normal: "11.0-14.0"
        borderline: "10.0-10.9"
        abnormal: "<10.0"
      creatinine:
        normal: "0.4-0.8"
        borderline: "0.9-1.0"
        abnormal: ">1.0"
  
  elderly:
    age_threshold: "> 65"
    modified_ranges:
      creatinine:
        adjustment: "age_based_calculation"
      nt_probnp:
        normal: "<450"

# Scoring Calculation Rules
scoring_rules:
  weight_factors:
    cardiac_markers: 1.5
    renal_function: 1.3
    liver_function: 1.2
    blood_count: 1.0
    lipid_profile: 0.8
    vitamins: 0.6
  
  minimum_tests_required:
    basic_panel: ["hemoglobin", "creatinine", "blood_pressure"]
    comprehensive: ["cbc", "liver_function", "renal_function", "lipid_profile"]